name: release

# A tag is the only thing that ships. Pushing v1.2.3 builds every platform,
# publishes one GitHub Release, and — because electron-builder writes the
# latest*.yml manifests beside the installers — every already-installed copy of
# the app finds it on its next launch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the installers but publish nothing'
        type: boolean
        default: true

permissions:
  contents: write   # to create the release and upload to it

jobs:
  build:
    strategy:
      fail-fast: false   # a broken Windows runner must not bin the macOS build
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The version in package.json is the source of truth for the updater, so a
      # tag that disagrees with it would ship a release the app can never see as
      # newer. Fail here rather than after three platform builds.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }

      - run: npm run build
      - run: npm run notices

      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned unless the certificates are present. Hardcoding this false
          # meant adding CSC_LINK would have changed nothing and shipped an
          # unsigned build anyway, silently.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A MISSING secret arrives as an empty string, not as an absent variable,
          # and electron-builder reads an empty CSC_LINK as "the path to a
          # certificate" — resolving "" against the working directory, which is
          # the repo root, and failing with `⨯ <repo> not a file`. Nothing in that
          # message mentions signing. Unset the empty ones so it sees what it sees
          # on a developer machine: nothing at all.
          # (an `&&` chain here would abort the step under `set -e` the moment a
          # variable IS set, which is the case this exists to leave alone)
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              unset "$v"
              echo "unset $v (no secret)"
            fi
          done
          if [ "${{ github.event_name }}" = "push" ]; then PUBLISH=always; else PUBLISH=never; fi
          echo "publish=$PUBLISH"
          # Notarising is OFF in the config, because with no Apple credentials
          # electron-builder does not skip it — it fails the whole macOS build.
          # Turn it on only when there is an Apple ID to notarise with.
          EXTRA=""
          if [ -n "${APPLE_ID:-}" ] && [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="--config.mac.notarize=true"
            echo "notarising: yes"
          else
            echo "notarising: no (no APPLE_ID)"
          fi
          npx electron-builder --publish "$PUBLISH" $EXTRA

      # The artifact is built by now but NOT yet in anyone's hands on a
      # workflow_dispatch, and on a tag it has just been uploaded — so this is
      # the last honest moment to ask whether it starts. v0.1.0 and v0.1.1 both
      # shipped an app that threw before its first window, and every other check
      # passed: the suites drive a DEV build, the tag matched, the installers
      # uploaded, the release page looked perfect.
      - name: The packaged app can start
        run: npm run verify:package

      - name: Keep the installers even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------ checksums
  # An unsigned installer gives a user nothing to verify against. Until there are
  # certificates, a published SHA256 is the only way for someone to tell the file
  # they downloaded from the file this workflow built — which matters most for
  # exactly the builds macOS and SmartScreen are already warning them about.
  #
  # It runs after all three platforms, because the point is ONE list covering
  # every installer in the release; a per-runner file would leave a reader
  # checking three of them and wondering which covers the download they have.
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hash every published installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          # Only the installers. The blockmaps and latest*.yml are the updater's
          # own bookkeeping, and listing them invites people to verify files they
          # never downloaded.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' \
            --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * | sort -k2 > ../SHA256SUMS.txt
          cd ..
          echo "--- SHA256SUMS.txt ---"; cat SHA256SUMS.txt
          test -s SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

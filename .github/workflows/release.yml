name: release

# A tag is the only thing that ships. Pushing v1.2.3 builds every platform,
# publishes one GitHub Release, and — because electron-builder writes the
# latest*.yml manifests beside the installers — every already-installed copy of
# the app finds it on its next launch.
on:
  push:
    tags: ['v*']
  # A manual run always builds and never publishes: publishing is what a TAG is
  # for. There used to be a `dry_run` input here, defaulting to true and read by
  # nothing, which offered a choice the workflow did not implement.
  workflow_dispatch:

permissions:
  contents: write   # to create the release and upload to it

jobs:
  build:
    strategy:
      fail-fast: false   # a broken Windows runner must not bin the macOS build
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The version in package.json is the source of truth for the updater, so a
      # tag that disagrees with it would ship a release the app can never see as
      # newer. Fail here rather than after three platform builds.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG does not match package.json $PKG"; exit 1; }

      - run: npm run build
      - run: npm run notices

      - name: Package and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned unless the certificates are present. Hardcoding this false
          # meant adding CSC_LINK would have changed nothing and shipped an
          # unsigned build anyway, silently.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # A MISSING secret arrives as an empty string, not as an absent variable,
          # and electron-builder reads an empty CSC_LINK as "the path to a
          # certificate" — resolving "" against the working directory, which is
          # the repo root, and failing with `⨯ <repo> not a file`. Nothing in that
          # message mentions signing. Unset the empty ones so it sees what it sees
          # on a developer machine: nothing at all.
          # (an `&&` chain here would abort the step under `set -e` the moment a
          # variable IS set, which is the case this exists to leave alone)
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              unset "$v"
              echo "unset $v (no secret)"
            fi
          done
          if [ "${{ github.event_name }}" = "push" ]; then PUBLISH=always; else PUBLISH=never; fi
          echo "publish=$PUBLISH"
          # Notarising is OFF in the config, because with no Apple credentials
          # electron-builder does not skip it — it fails the whole macOS build.
          # Turn it on only when there is an Apple ID to notarise with.
          EXTRA=""
          if [ -n "${APPLE_ID:-}" ] && [ "$RUNNER_OS" = "macOS" ]; then
            EXTRA="--config.mac.notarize=true"
            echo "notarising: yes"
          else
            echo "notarising: no (no APPLE_ID)"
          fi
          npx electron-builder --publish "$PUBLISH" $EXTRA

      # The artifact is built by now but NOT yet in anyone's hands on a
      # workflow_dispatch, and on a tag it has just been uploaded — so this is
      # the last honest moment to ask whether it starts. v0.1.0 and v0.1.1 both
      # shipped an app that threw before its first window, and every other check
      # passed: the suites drive a DEV build, the tag matched, the installers
      # uploaded, the release page looked perfect.
      - name: The packaged app can start
        run: npm run verify:package

      - name: Keep the installers even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------- checksums and the notes
  # An unsigned installer gives a user nothing to verify against. Until there are
  # certificates, a published SHA256 is the only way for someone to tell the file
  # they downloaded from the file this workflow built — which matters most for
  # exactly the builds macOS and SmartScreen are already warning them about.
  #
  # And electron-builder publishes with an EMPTY body, so every release page so
  # far has been a bare tag over a wall of binaries: nothing saying what changed,
  # and nothing about Gatekeeper where the people hitting Gatekeeper actually
  # are. That instruction lives on the website and in the README, neither of
  # which is the page they downloaded from.
  #
  # Both run after all three platforms, because both are about the release as a
  # whole: a per-runner checksum file would leave a reader holding three of them
  # wondering which one covers their download.
  finalise:
    needs: build
    # always(), because `needs:` alone means success() and this job is skipped
    # exactly when it matters most. The matrix is fail-fast: false and every
    # runner publishes as it finishes, with releaseType: release — so if Windows
    # fails at the packaged-app gate AFTER macOS and Linux have uploaded, there is
    # already a live, non-draft release that every installed copy is being offered,
    # and skipping this job leaves it with no body (no Gatekeeper instructions,
    # which is the whole reason the footer exists) and no checksums. It is worse
    # to say nothing there than anywhere else.
    #
    # push only, not merely "the ref is a tag": the Run-workflow selector accepts
    # tags, so a workflow_dispatch aimed at an existing tag would reach this job
    # while the build job published NOTHING — and `gh release edit --notes-file`
    # replaces a body outright. A dry run whose own description says it publishes
    # nothing would have overwritten a live release page, silently.
    # !cancelled() rather than always(): still runs when a platform FAILED, which
    # is the case this exists for, but not when a human stopped the run — nobody
    # who hits cancel wants the release page rewritten a minute later.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # With always(), this job now runs on a partial release too. Say so, in the
      # notes, where someone deciding whether to download can read it — rather
      # than leaving them to infer it from which files are missing.
      - name: Which platforms actually published
        id: platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Ask more than once, and distinguish "no such release" from "the API
          # did not answer". A single failed call was being read as "every
          # platform build failed", which silently skipped the checksums and the
          # body on a release that was in fact published and live.
          EXISTS=""
          for attempt in 1 2 3; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>err.txt; then EXISTS=yes; break; fi
            if grep -qi 'release not found\|not found (HTTP 404)' err.txt; then EXISTS=no; break; fi
            echo "attempt $attempt: $(head -1 err.txt)"; sleep $((attempt * 5))
          done
          if [ -z "$EXISTS" ]; then
            echo "::error::could not determine whether $TAG was released after 3 attempts"
            exit 1
          fi
          if [ "$EXISTS" = no ]; then
            echo "::warning::no release exists for $TAG — every platform build failed"
            echo "exists=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=yes" >> "$GITHUB_OUTPUT"
          NAMES="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true)"
          MISSING=""
          echo "$NAMES" | grep -q '\.dmg$'      || MISSING="$MISSING macOS"
          echo "$NAMES" | grep -q '\.exe$'      || MISSING="$MISSING Windows"
          # either Linux artefact counts as "Linux published"
          echo "$NAMES" | grep -qE '\.(AppImage|deb)$' || MISSING="$MISSING Linux"
          echo "missing=${MISSING# }" >> "$GITHUB_OUTPUT"
          if [ -n "$MISSING" ]; then echo "::warning::no installers for:$MISSING"; fi

      - name: Hash every published installer
        if: steps.platforms.outputs.exists == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          # Only the installers. The blockmaps and latest*.yml are the updater's
          # own bookkeeping, and listing them invites people to verify files they
          # never downloaded.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' --pattern '*.zip' --pattern '*.exe' \
            --pattern '*.AppImage' --pattern '*.deb'
          sha256sum * | sort -k2 > ../SHA256SUMS.txt
          cd ..
          echo "--- SHA256SUMS.txt ---"; cat SHA256SUMS.txt
          test -s SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      # The commit a release is tagged from already carries the explanation, in
      # full, so use it rather than asking anyone to write it twice.
      - name: Give the release a body
        # NOT gated on the checksum step: a flaky download or upload there must
        # not cost the release its Gatekeeper instructions, which are the part a
        # human actually needs.
        if: always() && steps.platforms.outputs.exists == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # `missing` is a step OUTPUT; the shell only sees it if it is mapped in
          # here. Without this line `${MISSING:-}` was always empty, `set -u`
          # could not catch it because of the default, and the whole
          # incomplete-release warning was unreachable code that reported success.
          MISSING: ${{ steps.platforms.outputs.missing }}
        run: |
          set -euo pipefail
          # HEAD, not "$TAG": the workflow was triggered BY that tag, so the
          # checked-out commit is the tagged one — and this way it does not
          # matter whether the checkout brought the tag ref along with it.
          # Trailers are for the log, not for a release page — drop them and any
          # blank lines they leave behind.
          git log -1 --pretty=format:'%B' \
            | sed -e '/^Co-[Aa]uthored-[Bb]y:/d' -e '/^Signed-off-by:/d' \
            | awk 'NF {blank=0; print; next} {blank++; if (blank<2) print}' > notes.md
          printf '\n' >> notes.md
          if [ -n "${MISSING:-}" ]; then
            printf '> **This release is incomplete.** No installers were published for: %s.\n' "$MISSING" >> notes.md
            printf '> Those builds failed; use the previous release for those platforms.\n\n' >> notes.md
          fi
          cat .github/release-notes-footer.md >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "release body set from the tagged commit ($(wc -l < notes.md) lines)"

name: test

on:
  push:
    branches: [main, master]
    # Tags too. A tag is what publishes, and until now the suite had never run on
    # a tagged commit — only on whatever branch push preceded it, which is the
    # same tree in the ordinary case and is not in the interesting one.
    tags: ['v*']
  pull_request:

# A newer push makes an older run pointless. Without this they queue up and the
# badge shows a result from three commits ago.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # SHARDED, because thirty-seven of the forty-three checks boot a real Electron
    # app and the whole sequence overran a 45-minute job every time — the badge on
    # this repo had never gone green on a suite that passes locally. Six shards
    # run the same checks in parallel; nothing is skipped, and the split is
    # derived from the `test` script itself so a new suite cannot be forgotten.
    #
    # Six rather than four because round-robin balances by COUNT, not by minutes,
    # and the durations are not close — the first four-way split had one shard
    # done in five minutes while another was still going at thirty. More, smaller
    # shards make the slowest one shorter without needing a table of timings that
    # would go stale.
    strategy:
      fail-fast: false   # one red shard must not hide what the others found
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: suite ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # poppler renders the exported PDFs in the erase suite, deliberately: it
      # shares no code with the pdf.js that drew them on screen, so a fault that
      # exists only in the written file cannot hide behind the renderer that
      # produced it. The rest are Electron's runtime libraries, which a headless
      # runner does not have by default.
      - name: System deps
        # BOUNDED, and the bound is the point. apt has no timeout of its own, so a
        # stalled mirror hangs forever — six jobs fetching at once found one, and
        # each sat in `apt-get update` until the job's own 40-minute limit killed
        # it. GitHub reports a timeout-killed job as "cancelled", so the run looked
        # like someone had pressed the button, five shards reported nothing, and
        # the badge went red for a reason that had nothing to do with the code.
        #
        # ForceIPv4 is the substantive fix. These runners advertise IPv6 and the
        # route to archive.ubuntu.com intermittently blackholes, so apt opens a
        # connection that neither completes nor resets and waits on it — which is
        # exactly the "slow mirror" this looked like, and why it hit some shards
        # of a run and not others.
        #
        # The rest is belt and braces: try the install against the image's own
        # package index FIRST, since the runner image ships a recent one and the
        # update is most of the network traffic; only refresh if that fails.
        # Per-request timeouts and retries inside apt, a step timeout so a hang
        # names itself instead of impersonating something else, and
        # noninteractive so nothing can sit on a prompt no one is there to answer.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          APT="sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 \
               -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          # libasound2t64 on noble, libasound2 before it
          ASOUND=libasound2t64
          apt-cache show "$ASOUND" >/dev/null 2>&1 || ASOUND=libasound2
          PKGS="poppler-utils xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                libgbm1 $ASOUND libxshmfence1 libxdamage1 libxrandr2 \
                libpangocairo-1.0-0 libgtk-3-0"
          if $APT install -y --no-install-recommends $PKGS; then
            echo "installed from the image's existing package index"
          else
            echo "falling back to a refresh"
            for attempt in 1 2 3; do
              $APT update && break
              echo "apt-get update failed (attempt $attempt)"; sleep $((attempt * 10))
            done
            $APT install -y --no-install-recommends $PKGS
          fi

      # One xvfb for the shard: every Electron suite launches its own app and one
      # display serves them all. Tier-2 erase cases (words baked into an image)
      # need a vision model to read them at all; with none reachable here they
      # SKIP with a note rather than fail, so CI stays honest instead of
      # green-by-omission.
      - name: Run shard
        run: xvfb-run --auto-servernum node scripts/run-suites.mjs ${{ matrix.shard }} 6

      - name: Keep the artefacts of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.shard }}-artifacts
          # The rendered PNGs — what a failing fidelity or erase check actually
          # saw. Electron profile directories live here too and are tens of
          # megabytes of nothing useful, so they are excluded.
          path: |
            tests/.artifacts/**
            !tests/.artifacts/**/*-profile/**
          # tests/.artifacts is a HIDDEN directory, and since v4.4 this action
          # skips those by default — the first failing run uploaded nothing at
          # all and said so in a line nobody would read.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
